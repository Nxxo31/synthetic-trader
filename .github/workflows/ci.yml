name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Determina el tipo de proyecto y ejecuta checks apropiados
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-node: ${{ steps.detect.outputs.is-node }}
      is-go: ${{ steps.detect.outputs.is-go }}
      is-python: ${{ steps.detect.outputs.is-python }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f package.json ]; then
            echo "is-node=true" >> $GITHUB_OUTPUT
          else
            echo "is-node=false" >> $GITHUB_OUTPUT
          fi
          if [ -f go.mod ]; then
            echo "is-go=true" >> $GITHUB_OUTPUT
          else
            echo "is-go=false" >> $GITHUB_OUTPUT
          fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "is-python=true" >> $GITHUB_OUTPUT
          else
            echo "is-python=false" >> $GITHUB_OUTPUT
          fi

  # === Layer 1: Compile (typecheck + lint + build) ===
  compile-node:
    needs: detect
    if: needs.detect.outputs.is-node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  compile-go:
    needs: detect
    if: needs.detect.outputs.is-go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  compile-python:
    needs: detect
    if: needs.detect.outputs.is-python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Compile check
        run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*")

  # === Layer 2: Tests ===
  test-node:
    needs: compile-node
    if: always() && needs.compile-node.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run tests (if test script exists)
        run: |
          if npm run | grep -q "  test "; then
            npm test
          else
            echo "No test script found — skipping"
          fi

  test-go:
    needs: compile-go
    if: always() && needs.compile-go.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - name: Run tests
        run: go test ./... -count=1
        continue-on-error: true

  test-python:
    needs: compile-python
    if: always() && needs.compile-python.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Run tests (if pytest exists)
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest || true
          else
            echo "No pytest found — skipping"
          fi
