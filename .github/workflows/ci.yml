name: CI - Verificación de 3 Capas
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        go-version: [1.22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para versiones y historia completa

      # --- CAPA 1: COMPILATION (typecheck + lint + build) ---
      - name: Setup Node.js ${{ matrix.node-version }}
        if: contains(github.workspace, 'node') || contains(github.workspace, 'typescript') || contains(github.workspace, 'javascript') || contains(github.workspace, 'nextjs') || contains(github.workspace, 'react') || contains(github.workspace, 'vue')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Go ${{ matrix.go-version }}
        if: contains(github.workspace, 'go') || contains(github.workspace, 'golang')
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
          if [ -f go.mod ]; then go mod download; fi

      - name: Layer 1 - Typecheck, Lint, Build
        id: layer1
        run: |
          echo "🔍 CHECKING REPO TYPE...
          if [ -f tsconfig.json ] || [ -f jsconfig.json ]; then
            echo "TypeScript/JavaScript project detected"
            if command -v tsc >/dev/null 2>&1; then
              echo "Running tsc --noEmit..."
              npx tsc --noEmit || { echo "❌ TypeScript check failed"; exit 1; }
            fi
            if command -v eslint >/dev/null 2>&1; then
              echo "Running ESLint..."
              npm run lint || npx eslint . --ext .ts,.tsx,.js,.jsx || { echo "❌ Lint failed"; exit 1; }
            fi
            if command -v prettier >/dev/null 2>&1; then
              echo "Running Prettier check..."
              npx prettier --check . || { echo "❌ Prettier check failed"; exit 1; }
            fi
            if [ -f package.json ] && [ -n "$(jq -r '.scripts.build // empty' package.json)" ]; then
              echo "Running build script..."
              npm run build || { echo "❌ Build failed"; exit 1; }
            fi
          elif [ -f go.mod ]; then
            echo "Go project detected"
            echo "Running go vet..."
            go vet ./... || { echo "❌ go vet failed"; exit 1; }
            echo "Running go fmt check..."
            test -z "$(go fmt ./... | tee /dev/stderr)" || { echo "❌ go fmt failed"; exit 1; }
            echo "Running go build..."
            go build ./... || { echo "❌ go build failed"; exit 1; }
          fi
          echo "✅ Layer 1 (Compile) PASSED"

      # --- CAPA 2: RUNTIME (start system, curl real endpoints) ---
      - name: Layer 2 - Runtime Verification
        id: layer2
        run: |
          echo "🚀 Starting runtime verification..."
          # Project-specific runtime checks
          if [ -f package.json ]; then
            # Node/TS projects
            if [ -f src/api/server.ts ] || [ -f src/server.ts ] || [ -f server.ts ]; then
              echo "Starting HTTP server for health check..."
              npm run start &
              SERVER_PID=$!
              sleep 5
              # Try health endpoint
              if curl -s -f http://localhost:3000/health >/dev/null; then
                echo "✅ Health endpoint responding"
              elif curl -s -f http://localhost:3000/api/health >/dev/null; then
                echo "✅ API health endpoint responding"
              elif curl -s -f http://localhost:3000/ >/dev/null; then
                echo "✅ Root endpoint responding"
              else
                echo "⚠️  No standard health endpoint found - checking if server is up..."
                if curl -s -I http://localhost:3000/ >/dev/null 2>&1; then
                  echo "✅ Server is accepting connections"
                else
                  echo "❌ Server not responding"
                  kill $SERVER_PID 2>/dev/null || true
                  exit 1
                fi
              fi
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
            fi
          fi
          
          if [ -f go.mod ]; then
            # Go projects
            if [ -f cmd/server/main.go ] || [ -f main.go ] || [ -f cmd/*/main.go ]; then
              echo "Starting Go server for health check..."
              go run . &
              SERVER_PID=$!
              sleep 5
              if curl -s -f http://localhost:8080/health >/dev/null; then
                echo "✅ Health endpoint responding"
              elif curl -s -f http://localhost:8080/ >/dev/null; then
                echo "✅ Root endpoint responding"
              else
                echo "⚠️  Checking if server is up..."
                if curl -s -I http://localhost:8080/ >/dev/null 2>&1; then
                  echo "✅ Server is accepting connections"
                else
                  echo "❌ Server not responding"
                  kill $SERVER_PID 2>/dev/null || true
                  exit 1
                fi
              fi
              kill $SERVER_PID 2>/dev/null || true
              wait $SERVER_PID 2>/dev/null || true
            fi
          fi
          echo "✅ Layer 2 (Runtime) PASSED"

      # --- CAPA 3: ADVERSARIAL (boundary, concurrency, idempotency) ---
      - name: Layer 3 - Adversarial Tests
        id: layer3
        run: |
          echo "🧪 Running adversarial tests..."
          # Run project-specific test suites
          if [ -f package.json ] && [ -n "$(jq -r '.scripts.test // empty' package.json)" ]; then
            echo "Running npm test..."
            npm test || { echo "❌ npm test failed"; exit 1; }
          elif [ -f go.mod ]; then
            echo "Running go test..."
            go test ./... -v || { echo "❌ go test failed"; exit 1; }
          elif [ -f Cargo.toml ]; then
            echo "Running cargo test..."
            cargo test --verbose || { echo "❌ cargo test failed"; exit 1; }
          fi
          echo "✅ Layer 3 (Adversarial) PASSED"

      # Final summary
      - name: Summary
        run: |
          echo "🎉 ALL 3 LAYERS PASSED!"
          echo "✅ Layer 1: Compile (typecheck + lint + build)"
          echo "✅ Layer 2: Runtime (server startup + health checks)"
          echo "✅ Layer 3: Adversarial (test suite)"